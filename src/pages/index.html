<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../styles/home.css" />
    <script type="module" src="../components/events-calendar/events-calendar.tsx"></script>
    <script type="module" src="../components/posts-list/posts-list.tsx"></script>
  </head>
  <body>
    <div class="as-view-home">
      <div class="as-media-carousel">
        <img
          src="/assets/home-banner.webp"
          class="img-fluid"
          alt="banner image of founders in chairs"
        />

        <span class="as-media-carousel__label"> Welcome to Analog Studios! </span>

        <span class="as-media-carousel__attribution-label"
          >Photo courtesy of
          <a
            href="http://www.maciaphotography.com/"
            class="as-media-carousel__attribution-label-link"
            target="_blank"
            rel="noopener noreferrer"
            alt="Morgan Macia Photography"
            >Morgan Macia
          </a>
        </span>
      </div>

      <div class="as-info-container">
        <div class="as-info-content">
          <as-posts-list max="2"></as-posts-list>
        </div>

        <div class="as-info-content">
          <as-events-calendar></as-events-calendar>
        </div>
      </div>
    </div>
  </body>
</html>
